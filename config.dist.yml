app:
  name: ${TING_SERVER_NAME:-Ting}
  mode: ${TING_SERVER_MODE:-prod}
  port: ${TING_SERVER_PORT:-8080}

  log:
    level: ${TING_SERVER_LOG_LEVEL:-info}
    output: ${TING_SERVER_LOG_OUTPUT:-stdout}
    format: ${TING_SERVER_LOG_FORMAT:-console}

upstream:
  url: ${TING_UPSTREAM_URL:-https://openrouter.ai}
  api_key: ${OPENROUTER_API_KEY:-}
